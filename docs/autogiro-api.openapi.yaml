openapi: 3.0.3
info:
  title: AutoGiro API
  version: 1.0.0
  description: |-
    Contrato da API do AutoGiro (financiamento de veículos). Fonte da verdade para o front-end e o back-end.

    **Convenções**
    - Dinheiro: número decimal com 2 casas (`58900.00`), nunca texto.
    - Taxas: sempre em percentual, na entrada e na saída (`1.8` = 1,8% ao mês). Os campos terminam em `Percentual`.
    - Datas e horas: ISO 8601 em UTC (`2026-11-16T12:00:00Z`).
    - Identificadores: UUID.
    - Erros: corpo `{ "erro", "codigo", "detalhes" }`.
    - Autenticação: `Authorization: Bearer <token>` (login do Supabase). Só o catálogo, a política de crédito e o `/health` são públicos.
    - Os nomes dos campos seguem as tabelas do banco (`autogiro-schema.sql`).

    **Fluxo completo**
    1. O cliente escolhe um veículo e simula (`POST /simulacoes`) com um perfil de crédito estimado (faixa A a D).
    2. Cria a proposta (`POST /propostas`) e envia (`POST /propostas/{id}/envio`).
    3. O back-end faz a análise de crédito (`POST /propostas/{id}/analise-credito`): Score, Decisão e, se aprovada, Juros.
    4. O cliente escolhe PRICE ou SAC (`POST /propostas/{id}/contratacao`). A operação nasce no serviço de operações e a proposta guarda o `numeroOperacao`.
    5. Parcelas, pagamentos, amortização e liquidação passam a ser consultados no serviço de operações.

    **Integrações** (só o back-end do AutoGiro as chama)
    - Serviço de juros (`calculo-juros-facul`, Express, porta 3000, CORS liberado): `POST /api/operacoes` simula PRICE e SAC com IOF e CET; `POST /api/operacoes/{id}/definicao` escolhe o sistema e envia a operação ao serviço de operações. Modalidade usada: `VEICULOS`, com prazo de 12 a 60 meses e taxa por faixa de score (tabela atual: 1,50% a 3,00% ao mês; a faixa E, score abaixo de 200, é recusada). O `identificador` da operação segue o formato `OP-AAAA-NNNN`.
    - Serviço de operações (`financial-operations-service`, Go, porta 8083): parcelas, pagamentos, amortização e liquidação, consultados pelo `numeroOperacao`.
    - Score e Decisão (outro grupo): contrato ainda não recebido.

    **Estado atual:** enquanto o back-end do AutoGiro não existe, o front chama o serviço de operações direto e usa a política de crédito de referência (a mesma tabela do serviço de juros).

    **Pendente:** o contrato de Score e Decisão. Os trechos marcados com `x-pendente` podem mudar quando ele chegar.
servers:
- url: http://localhost:3001
  description: Desenvolvimento local
tags:
- name: Veículos
  description: Catálogo público
- name: Crédito
  description: 'Política de crédito: prazos e taxas por perfil'
- name: Simulações
  description: Cálculo PRICE e SAC
- name: Clientes
  description: Cadastro do usuário logado
- name: Propostas
  description: Pedido de financiamento e análise de crédito
- name: Sistema
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Verifica se a API está no ar
      security: []
      responses:
        '200':
          description: Serviço no ar.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ok
  /veiculos:
    get:
      tags:
      - Veículos
      summary: Lista veículos com filtros, ordenação e paginação
      security: []
      parameters:
      - name: busca
        in: query
        schema:
          type: string
        description: Marca, modelo ou versão.
      - name: categoria
        in: query
        schema:
          $ref: '#/components/schemas/CategoriaVeiculo'
      - name: precoMax
        in: query
        schema:
          type: number
          minimum: 0
      - name: ordenacao
        in: query
        schema:
          type: string
          enum:
          - menor_preco
          - maior_preco
          - mais_novo
          - menor_km
          default: menor_preco
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tamanhoPagina
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
      responses:
        '200':
          description: Página de veículos (somente disponíveis e reservados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaVeiculos'
        '400':
          $ref: '#/components/responses/Invalido'
  /veiculos/{id}:
    get:
      tags:
      - Veículos
      summary: Detalhe de um veículo
      security: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Veículo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veiculo'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /simulacoes:
    post:
      tags:
      - Simulações
      summary: Calcula e registra uma simulação
      description: O servidor recalcula tudo. Valores enviados pelo cliente além dos campos abaixo são ignorados.
        A taxa vem da política de crédito (`GET /credito/politica`) para a faixa informada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacaoRequest'
      responses:
        '201':
          description: Simulação criada, com o cronograma completo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacao'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /simulacoes/{id}:
    get:
      tags:
      - Simulações
      summary: Consulta uma simulação do usuário logado
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Simulação com cronograma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /credito/politica:
    get:
      tags:
      - Crédito
      summary: Política de crédito para veículos (prazos e taxa por faixa de score)
      description: Repassa a modalidade `VEICULOS` do serviço de juros (`GET /api/modalidades/VEICULOS`). O simulador
        do site usa esta tabela.
      security: []
      responses:
        '200':
          description: Política vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCredito'
  /clientes/me:
    get:
      tags:
      - Clientes
      summary: Cadastro do usuário logado
      responses:
        '200':
          description: Cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags:
      - Clientes
      summary: Cria ou atualiza o cadastro do usuário logado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '200':
          description: Cadastro salvo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /propostas:
    get:
      tags:
      - Propostas
      summary: Lista as propostas do usuário logado
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/StatusProposta'
      responses:
        '200':
          description: Propostas, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags:
      - Propostas
      summary: Cria uma proposta em rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropostaRequest'
      responses:
        '201':
          description: Proposta criada com status RASCUNHO.
          headers:
            Location:
              description: Caminho da proposta criada.
              schema:
                type: string
                example: /propostas/0b9d6c5e-1c3a-4e0b-9d11-2f4f5b6a7c88
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposta'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /propostas/{id}:
    get:
      tags:
      - Propostas
      summary: Consulta uma proposta
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Proposta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /propostas/{id}/envio:
    post:
      tags:
      - Propostas
      summary: Envia o rascunho (RASCUNHO para ENVIADA)
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Proposta enviada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposta'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /propostas/{id}/cancelamento:
    post:
      tags:
      - Propostas
      summary: Cancela uma proposta em rascunho ou enviada
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Proposta cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposta'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /propostas/{id}/contratacao:
    post:
      tags:
      - Propostas
      summary: Contrata a proposta aprovada, escolhendo PRICE ou SAC
      description: |-
        Só vale para proposta `APROVADA`, com a operação já simulada no serviço de juros.
        O back-end chama `POST /api/operacoes/{id}/definicao` no serviço de juros, que registra a operação no serviço de operações.
        Em caso de sucesso, a proposta vira `CONTRATADA` e recebe o `numeroOperacao`.
        Se o envio ao serviço de operações falhar, a definição continua valendo e `operacao.registroOperacoes` indica `FALHOU` ou `PENDENTE`; o reenvio é `POST /api/operacoes/{id}/finops` no serviço de juros.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratacaoRequest'
      responses:
        '200':
          description: Proposta contratada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contratacao'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '502':
          description: O serviço de juros não respondeu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /propostas/{id}/eventos:
    get:
      tags:
      - Propostas
      summary: Histórico de status da proposta
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Eventos em ordem cronológica.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoProposta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /propostas/{id}/analise-credito:
    post:
      tags:
      - Propostas
      summary: Inicia a análise de crédito na esteira (score, decisão e juros)
      description: |-
        Pipeline: Score (contrato pendente) → Decisão (contrato pendente) → Juros.
        Quando aprovada, o back-end cria a operação no serviço de juros com `POST /api/operacoes` (`identificador` no formato `OP-AAAA-NNNN`, `modalidade: VEICULOS`, `score` de 0 a 1000, `prazoMeses` de 12 a 60 e `cliente` com `tipoPessoa` e `documento`). Ele devolve a simulação PRICE e SAC, com IOF e CET.
        O navegador nunca chama o Score nem o serviço de juros diretamente por este fluxo.
        `x-pendente`: os campos do Score podem mudar quando o contrato chegar.
      x-pendente: true
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnaliseCreditoRequest'
      responses:
        '202':
          description: Análise iniciada ou concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnaliseCredito'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '502':
          description: A esteira de crédito não respondeu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Invalido:
      description: JSON malformado ou regra de validação violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Dados inválidos
            codigo: VALIDACAO
            detalhes:
            - campo: entrada
              mensagem: A entrada deve ser menor que o valor do veículo.
    NaoAutenticado:
      description: Token ausente ou inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Faça login para continuar
            codigo: NAO_AUTENTICADO
    NaoEncontrado:
      description: Recurso inexistente ou de outro usuário.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Veículo não encontrado
            codigo: NAO_ENCONTRADO
    Conflito:
      description: Estado incompatível (proposta não aprovada ou já contratada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: A proposta não está aprovada
            codigo: ESTADO_INVALIDO
  schemas:
    Erro:
      type: object
      required:
      - erro
      - codigo
      properties:
        erro:
          type: string
          description: Mensagem legível para o usuário.
        codigo:
          type: string
          description: 'Código estável: VALIDACAO, NAO_AUTENTICADO, NAO_ENCONTRADO, ESTADO_INVALIDO, ESTEIRA_INDISPONIVEL.'
        detalhes:
          type: array
          items:
            type: object
            required:
            - campo
            - mensagem
            properties:
              campo:
                type: string
              mensagem:
                type: string
    CategoriaVeiculo:
      type: string
      enum:
      - hatch
      - sedan
      - suv
      - picape
      - moto
    StatusProposta:
      type: string
      enum:
      - RASCUNHO
      - ENVIADA
      - EM_ANALISE
      - APROVADA
      - REPROVADA
      - CONTRATADA
      - CANCELADA
    Veiculo:
      type: object
      required:
      - id
      - marca
      - modelo
      - ano
      - quilometragem
      - preco
      - categoria
      - combustivel
      - cambio
      - cidade
      - status
      properties:
        id:
          type: string
          format: uuid
        marca:
          type: string
          example: Fiat
        modelo:
          type: string
          example: Argo
        versao:
          type: string
          nullable: true
          example: 1.0 Drive
        ano:
          type: integer
          example: 2021
        quilometragem:
          type: integer
          minimum: 0
          example: 42000
        preco:
          type: number
          format: double
          example: 58900.0
        categoria:
          $ref: '#/components/schemas/CategoriaVeiculo'
        combustivel:
          type: string
          enum:
          - flex
          - gasolina
          - diesel
          - eletrico
        cambio:
          type: string
          enum:
          - manual
          - automatico
        cidade:
          type: string
          example: São Paulo
        status:
          type: string
          enum:
          - disponivel
          - reservado
    ListaVeiculos:
      type: object
      required:
      - itens
      - total
      - pagina
      - tamanhoPagina
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Veiculo'
        total:
          type: integer
          description: Total de veículos que atendem aos filtros.
        pagina:
          type: integer
        tamanhoPagina:
          type: integer
    SimulacaoRequest:
      type: object
      required:
      - veiculoId
      - entrada
      - prazoMeses
      - sistema
      - faixaRisco
      properties:
        veiculoId:
          type: string
          format: uuid
        entrada:
          type: number
          minimum: 0
          description: Menor que o preço do veículo.
          example: 11780.0
        prazoMeses:
          type: integer
          minimum: 12
          maximum: 60
          example: 48
          description: Limites da modalidade VEICULOS; consulte `GET /credito/politica`.
        sistema:
          type: string
          enum:
          - PRICE
          - SAC
        faixaRisco:
          type: string
          enum:
          - A
          - B
          - C
          - D
          example: B
          description: Perfil de crédito estimado. A taxa vem da política. O score real, que define a taxa final,
            só é conhecido na análise de crédito. A faixa E é recusada e não é aceita aqui.
    Parcela:
      type: object
      required:
      - numero
      - valor
      - juros
      - amortizacao
      - saldoDevedor
      properties:
        numero:
          type: integer
          minimum: 1
        valor:
          type: number
          format: double
        juros:
          type: number
          format: double
        amortizacao:
          type: number
          format: double
        saldoDevedor:
          type: number
          format: double
    Simulacao:
      type: object
      required:
      - id
      - veiculoId
      - valorVeiculo
      - entrada
      - prazoMeses
      - taxaMensalPercentual
      - sistema
      - valorFinanciado
      - primeiraParcela
      - ultimaParcela
      - totalPago
      - totalJuros
      - criadaEm
      - parcelas
      - faixaRisco
      properties:
        id:
          type: string
          format: uuid
        veiculoId:
          type: string
          format: uuid
        valorVeiculo:
          type: number
          format: double
        entrada:
          type: number
          format: double
        prazoMeses:
          type: integer
        taxaMensalPercentual:
          type: number
          example: 1.8
        sistema:
          type: string
          enum:
          - PRICE
          - SAC
        valorFinanciado:
          type: number
          format: double
          description: valorVeiculo menos entrada.
        primeiraParcela:
          type: number
          format: double
        ultimaParcela:
          type: number
          format: double
        totalPago:
          type: number
          format: double
          description: Soma das parcelas, sem a entrada.
        totalJuros:
          type: number
          format: double
        criadaEm:
          type: string
          format: date-time
        parcelas:
          type: array
          items:
            $ref: '#/components/schemas/Parcela'
        faixaRisco:
          type: string
          enum:
          - A
          - B
          - C
          - D
          description: Perfil usado na simulação. O que fica gravado é a taxa (`taxaMensalPercentual`).
    ClienteRequest:
      type: object
      required:
      - nome
      - email
      properties:
        nome:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
          example: '11999998888'
    Cliente:
      allOf:
      - $ref: '#/components/schemas/ClienteRequest'
      - type: object
        required:
        - id
        - criadoEm
        properties:
          id:
            type: string
            format: uuid
          criadoEm:
            type: string
            format: date-time
    PropostaRequest:
      type: object
      required:
      - veiculoId
      properties:
        veiculoId:
          type: string
          format: uuid
        simulacaoId:
          type: string
          format: uuid
          nullable: true
        observacao:
          type: string
          nullable: true
    Proposta:
      type: object
      required:
      - id
      - clienteId
      - veiculoId
      - status
      - criadaEm
      - atualizadaEm
      properties:
        id:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        veiculoId:
          type: string
          format: uuid
        simulacaoId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/StatusProposta'
        numeroOperacao:
          type: string
          nullable: true
          example: OP-2026-0001
          description: Preenchido pelo back-end quando a operação é registrada no serviço de operações.
        observacao:
          type: string
          nullable: true
        criadaEm:
          type: string
          format: date-time
        atualizadaEm:
          type: string
          format: date-time
    EventoProposta:
      type: object
      required:
      - id
      - status
      - criadoEm
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatusProposta'
        observacao:
          type: string
          nullable: true
        criadoEm:
          type: string
          format: date-time
    AnaliseCreditoRequest:
      type: object
      x-pendente: true
      required:
      - cliente
      description: Campos baseados no exemplo do CredCasa; podem mudar quando o contrato do Score chegar.
      properties:
        cliente:
          type: object
          required:
          - nome
          - tipoPessoa
          - cpf
          - rendaMensal
          properties:
            nome:
              type: string
            tipoPessoa:
              type: string
              enum:
              - PF
            cpf:
              type: string
              pattern: ^[0-9]{11}$
              description: Só dígitos. Dado pessoal sensível; nunca guardar em log nem no banco do AutoGiro.
              example: '12345678900'
            rendaMensal:
              type: number
              minimum: 0
              example: 15000
    AnaliseCredito:
      type: object
      x-pendente: true
      required:
      - idFinanciamento
      - status
      properties:
        idFinanciamento:
          type: string
          example: FIN-1794264143650-4E7E1A
        status:
          type: string
          example: FINALIZADO
        score:
          type: object
          properties:
            scoreFinal:
              type: integer
              example: 780
            faixaRisco:
              type: string
              example: BAIXO_RISCO
            probabilidadeDefault:
              type: number
              example: 0.08
        decisao:
          type: object
          properties:
            status:
              type: string
              enum:
              - APROVADO
              - REPROVADO
              - ANALISE_MANUAL
            motivo:
              type: string
        operacao:
          type: object
          nullable: true
          properties:
            status:
              type: string
              example: FINALIZADA
            protocolo:
              type: string
              example: OP-1794264143704
        identificadorOperacao:
          type: string
          example: OP-2026-0001
          description: Identificador da operação criada no serviço de juros, quando a análise é aprovada.
    FaixaCredito:
      type: object
      required:
      - faixa
      - scoreMin
      - scoreMax
      - taxaMensalPercentual
      - taxaAnualPercentual
      - descricao
      - permiteContratacao
      properties:
        faixa:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - E
        scoreMin:
          type: integer
          example: 800
        scoreMax:
          type: integer
          example: 1000
        taxaMensalPercentual:
          type: number
          nullable: true
          example: 1.5
          description: Nulo na faixa E (contratação recusada).
        taxaAnualPercentual:
          type: number
          nullable: true
          example: 19.56
        descricao:
          type: string
          example: Risco muito baixo
        permiteContratacao:
          type: boolean
    PoliticaCredito:
      type: object
      required:
      - modalidade
      - prazoMinMeses
      - prazoMaxMeses
      - tetoTaxaMensalPercentual
      - faixas
      properties:
        modalidade:
          type: string
          example: VEICULOS
        prazoMinMeses:
          type: integer
          example: 12
        prazoMaxMeses:
          type: integer
          example: 60
        tetoTaxaMensalPercentual:
          type: number
          example: 3.0
        faixas:
          type: array
          items:
            $ref: '#/components/schemas/FaixaCredito'
    ContratacaoRequest:
      type: object
      required:
      - sistema
      properties:
        sistema:
          type: string
          enum:
          - PRICE
          - SAC
    Contratacao:
      type: object
      required:
      - proposta
      - operacao
      properties:
        proposta:
          $ref: '#/components/schemas/Proposta'
        operacao:
          type: object
          required:
          - numeroOperacao
          - estado
          - sistema
          - registroOperacoes
          properties:
            numeroOperacao:
              type: string
              example: OP-2026-0001
            estado:
              type: string
              enum:
              - DEFINIDA
            sistema:
              type: string
              enum:
              - PRICE
              - SAC
            registroOperacoes:
              type: string
              enum:
              - REGISTRADA
              - FALHOU
              - PENDENTE
              description: 'Situação do envio ao serviço de operações. FALHOU ou PENDENTE: a definição já vale e
                o reenvio é manual.'
security:
- bearerAuth: []
